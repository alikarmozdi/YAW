plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.kntu.turnestimator'
    compileSdk 34

    defaultConfig {
        applicationId "ir.kntu.turnestimator"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0-A17"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}

name: Build Turn Estimator APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Create Android Project Files
        run: |
          mkdir -p app/src/main/java/ir/kntu/turnestimator

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TurnYawEstimator"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ir.kntu.turnestimator'
              compileSdk 34

              defaultConfig {
                  applicationId "ir.kntu.turnestimator"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "2.0-A17"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.hardware.sensor.gyroscope" android:required="true" />
              <uses-feature android:name="android.hardware.sensor.compass" android:required="true" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_menu_compass"
                  android:label="Turn Yaw A17"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/ir/kntu/turnestimator/MainActivity.java
          package ir.kntu.turnestimator;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.hardware.Sensor;
          import android.hardware.SensorEvent;
          import android.hardware.SensorEventListener;
          import android.hardware.SensorManager;
          import android.os.Bundle;
          import android.text.InputType;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.Locale;

          public class MainActivity extends Activity implements SensorEventListener {

              // --- سنسورها (فقط ژایرو محور Z و قطب‌نمای افقی X-Y برای سامسونگ A17) ---
              private SensorManager sensorManager;
              private Sensor gyroSensor, magSensor;

              // --- داده‌های قطب‌نما در صفحه افقی (X, Y) ---
              private final float[] magRaw = new float[]{0f, 0f};
              private boolean hasMag = false;

              // --- کالیبراسیون Hard-Iron افقی (X, Y) ---
              private boolean isCalibratingMag = false;
              private final float[] magMin = new float[]{1000f, 1000f};
              private final float[] magMax = new float[]{-1000f, -1000f};
              private final float[] magHardIron = new float[]{0f, 0f};

              // --- ۴ پارامتر اسلایدر بین 0.00 تا 1.00 (مأنوس و شهودی) ---
              private double sliderTurnSensitivity = 0.50; // حساسیت تشخیص پیچ
              private double sliderGyroTrust       = 0.75; // میزان اعتماد به ژایرو
              private double sliderMagDistortion   = 0.60; // حساسیت به اعوجاج میدان قطب‌نما
              private double sliderVibrationFilter = 0.55; // قدرت فیلتر لرزش خودرو و جاده

              // --- پارامترهای فیزیکی مشتق‌شده از ۴ اسلایدر (تنظیم شده برای Samsung A17) ---
              private double omegaStart = 9.0;       // deg/s
              private double omegaStop = 3.2;        // deg/s
              private double minTurnAngle = 11.0;    // deg - حداقل زاویه پیچ واقعی
              private double confirmTimeReq = 0.28;  // sec - زمان تایید ورود به پیچ برای رد تکان‌ها
              private double lpfAlpha = 0.12;        // ضریب فیلتر پایین‌گذر ژایرو
              private double biasLearnRate = 0.002;  // نرخ یادگیری بایاس در مسیر مستقیم

              // --- متغیرهای حالت ---
              private enum State { STRAIGHT, TURNING }
              private State currentState = State.STRAIGHT;

              private double cumulativeHeading = 0.0;
              private double gyroBiasZ = 0.0;
              private double omegaFiltered = 0.0;
              private double omegaFiltered2 = 0.0; // فیلتر طبقه دوم برای حذف کامل لرزش جاده
              private long lastGyroTimestamp = 0;

              // بافر حلقوی پیش‌نگری (حداکثر 500 نمونه ~ 5 ثانیه)
              private static final int RING_CAPACITY = 500;
              private final double[] ringDpsi = new double[RING_CAPACITY];
              private final double[] ringDt = new double[RING_CAPACITY];
              private int ringHead = 0;
              private int ringCount = 0;

              // بردار مغناطیسی افقی (X, Y) فیلترشده
              private final double[] magXYFiltered = new double[]{0.0, 0.0};
              private final double[] magXYStart = new double[]{0.0, 0.0};
              private double magNormStart = 0.0;
              private boolean magFilterInit = false;

              // متغیرهای تشخیص و انتگرال‌گیری پیچ
              private double aboveStartTimer = 0.0;
              private double turnGyroDeltaPsi = 0.0;
              private double turnDuration = 0.0;
              private double belowStopTimer = 0.0;
              private double settleTailDpsi = 0.0;
              private int turnCounter = 0;

              // --- المان‌های رابط کاربری ---
              private TextView tvStateBanner, tvHeading, tvLiveGyro, tvLastTurnSummary, tvCalibStatus, tvLog;
              private EditText etInitHeading;
              private SeekBar sbSensitivity, sbGyroTrust, sbMagDistortion, sbVibFilter;
              private TextView tvValSensitivity, tvValGyroTrust, tvValMagDistortion, tvValVibFilter;

              private final StringBuilder csvBuilder = new StringBuilder(
                      "Turn,Duration_s,dPsi_Gyro,dPsi_Mag,Gyro_Weight,dPsi_Fused,Total_Heading,dMagNorm_uT\n");

              private SharedPreferences prefs;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  prefs = getSharedPreferences("TurnEstimatorA17Prefs", Context.MODE_PRIVATE);
                  loadPreferences();
                  recalculateInternalParameters();

                  sensorManager = (SensorManager) getSystemService(Context.SENSOR_SERVICE);
                  if (sensorManager != null) {
                      gyroSensor = sensorManager.getDefaultSensor(Sensor.TYPE_GYROSCOPE);
                      magSensor = sensorManager.getDefaultSensor(Sensor.TYPE_MAGNETIC_FIELD);
                  }

                  buildUserInterface();
              }

              private void recalculateInternalParameters() {
                  // 1. حساسیت تشخیص پیچ (0 = ضد لرزش قوی / آستانه بالا، 1 = بسیار حساس به پیچ نرم)
                  omegaStart = 15.0 - 10.5 * sliderTurnSensitivity; // از 15.0 تا 4.5 درجه بر ثانیه
                  omegaStop  = Math.max(1.5, 0.36 * omegaStart);    // آستانه خروج متناسب با شروع
                  minTurnAngle = 16.0 - 10.0 * sliderTurnSensitivity; // حداقل زاویه پیچ از 16 تا 6 درجه

                  // 2. فیلتر لرزش خودرو و جاده (0 = پاسخ تند، 1 = فیلتر بسیار نرم و زمان تایید طولانی‌تر)
                  lpfAlpha = 0.28 - 0.22 * sliderVibrationFilter;   // از 0.28 تا 0.06
                  confirmTimeReq = 0.15 + 0.30 * sliderVibrationFilter; // از 0.15 تا 0.45 ثانیه پایداری پیچ
                  biasLearnRate = 0.001 + 0.004 * (1.0 - 0.5 * sliderVibrationFilter);
              }

              private void buildUserInterface() {
                  ScrollView scrollView = new ScrollView(this);
                  scrollView.setBackgroundColor(Color.parseColor("#12161F"));

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  int pad = dp(14);
                  root.setPadding(pad, pad, pad, pad);

                  // بنر وضعیت لحظه‌ای
                  tvStateBanner = new TextView(this);
                  tvStateBanner.setText("وضعیت: مسیر مستقیم (در حال یادگیری بایاس)");
                  tvStateBanner.setTextColor(Color.WHITE);
                  tvStateBanner.setTextSize(16);
                  tvStateBanner.setTypeface(Typeface.DEFAULT_BOLD);
                  tvStateBanner.setGravity(Gravity.CENTER);
                  tvStateBanner.setBackgroundColor(Color.parseColor("#1E6F5C"));
                  tvStateBanner.setPadding(dp(10), dp(12), dp(10), dp(12));
                  root.addView(tvStateBanner, makeParams(0, 10));

                  // کارت نمایشگرهای اصلی
                  LinearLayout cardMain = makeCard();
                  tvHeading = makeText("زاویه سمت خودرو (ψ): 0.0°", 22, Color.parseColor("#FFD166"), true);
                  tvLiveGyro = makeText("چرخش فیلترشده (Z): 0.0°/s | بایاس: 0.00°/s", 13, Color.parseColor("#CCCCCC"), false);
                  tvLastTurnSummary = makeText(
                          "آخرین پیچ ثبت‌شده:\n" +
                          "• Δψ ژایرو: 0.0°  |  Δψ قطب‌نما: 0.0°\n" +
                          "• سهم ژایرو: 0%  |  Δψ نهایی: 0.0°",
                          14, Color.parseColor("#06D6A0"), false);
                  cardMain.addView(tvHeading);
                  cardMain.addView(tvLiveGyro, makeParams(6, 8));
                  cardMain.addView(tvLastTurnSummary);
                  root.addView(cardMain, makeParams(0, 10));

                  // کارت ۴ اسلایدر تنظیمات (بین 0.00 تا 1.00)
                  LinearLayout cardSliders = makeCard();
                  cardSliders.addView(makeText("تنظیمات هوشمند الگوریتم (بین ۰ تا ۱ - مخصوص Galaxy A17)", 15, Color.parseColor("#FFD166"), true));

                  // اسلایدر ۱: حساسیت تشخیص پیچ
                  tvValSensitivity = new TextView(this);
                  sbSensitivity = addSliderControl(cardSliders,
                          "۱. حساسیت تشخیص پیچ",
                          "کمتر = نادیده گرفتن انحرافات مسیر مستقیم | بیشتر = تشخیص پیچ‌های نرم",
                          sliderTurnSensitivity, tvValSensitivity, val -> {
                              sliderTurnSensitivity = val;
                              recalculateInternalParameters();
                              updateSliderLabels();
                              savePreferences();
                          });

                  // اسلایدر ۲: میزان اعتماد به ژایرو
                  tvValGyroTrust = new TextView(this);
                  sbGyroTrust = addSliderControl(cardSliders,
                          "۲. میزان اعتماد به ژایرو (در برابر قطب‌نما)",
                          "۰.۰۰ = فقط قطب‌نما | ۱.۰۰ = فقط ژایرو | میانه = ترکیب هوشمند کالمن",
                          sliderGyroTrust, tvValGyroTrust, val -> {
                              sliderGyroTrust = val;
                              updateSliderLabels();
                              savePreferences();
                          });

                  // اسلایدر ۳: حساسیت به اعوجاج میدان قطب‌نما
                  tvValMagDistortion = new TextView(this);
                  sbMagDistortion = addSliderControl(cardSliders,
                          "۳. حساسیت به اعوجاج میدان قطب‌نما",
                          "بیشتر = کنار گذاشتن سریع‌تر قطب‌نما در چهارراه‌های دارای آهن و برق",
                          sliderMagDistortion, tvValMagDistortion, val -> {
                              sliderMagDistortion = val;
                              updateSliderLabels();
                              savePreferences();
                          });

                  // اسلایدر ۴: قدرت فیلتر لرزش خودرو
                  tvValVibFilter = new TextView(this);
                  sbVibFilter = addSliderControl(cardSliders,
                          "۴. فیلتر لرزش خودرو و ناهمواری جاده",
                          "بیشتر = حذف قوی‌تر لرزش‌های کابین و جلوگیری از تشخیص کاذب پیچ",
                          sliderVibrationFilter, tvValVibFilter, val -> {
                              sliderVibrationFilter = val;
                              recalculateInternalParameters();
                              updateSliderLabels();
                              savePreferences();
                          });

                  Button btnResetDefaults = makeButton("بازگشت به مقادیر پیش‌فرض سامسونگ A17", "#3A506B");
                  btnResetDefaults.setOnClickListener(v -> {
                      sliderTurnSensitivity = 0.50;
                      sliderGyroTrust = 0.75;
                      sliderMagDistortion = 0.60;
                      sliderVibrationFilter = 0.55;
                      sbSensitivity.setProgress(50);
                      sbGyroTrust.setProgress(75);
                      sbMagDistortion.setProgress(60);
                      sbVibFilter.setProgress(55);
                      recalculateInternalParameters();
                      updateSliderLabels();
                      savePreferences();
                      Toast.makeText(this, "تنظیمات بهینه A17 بازگردانی شد", Toast.LENGTH_SHORT).show();
                  });
                  cardSliders.addView(btnResetDefaults, makeParams(10, 0));
                  updateSliderLabels();
                  root.addView(cardSliders, makeParams(0, 10));

                  // کارت زاویه اولیه و کالیبراسیون قطب‌نما (افقی X-Y)
                  LinearLayout cardControls = makeCard();
                  cardControls.addView(makeText("زاویه سمت اولیه و کالیبراسیون افقی قطب‌نما", 15, Color.WHITE, true));

                  LinearLayout rowHeading = new LinearLayout(this);
                  rowHeading.setOrientation(LinearLayout.HORIZONTAL);
                  etInitHeading = makeInput(String.valueOf(cumulativeHeading));
                  Button btnSetHeading = makeButton("ثبت زاویه اولیه (°)", "#118AB2");
                  btnSetHeading.setOnClickListener(v -> {
                      try {
                          cumulativeHeading = Double.parseDouble(etInitHeading.getText().toString());
                          turnGyroDeltaPsi = 0.0;
                          Toast.makeText(this, "زاویه اولیه ثبت شد", Toast.LENGTH_SHORT).show();
                      } catch (Exception ignored) {}
                  });
                  LinearLayout.LayoutParams lpInput = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
                  lpInput.setMargins(0, 0, dp(8), 0);
                  rowHeading.addView(etInitHeading, lpInput);
                  rowHeading.addView(btnSetHeading, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1.3f));
                  cardControls.addView(rowHeading, makeParams(8, 8));

                  tvCalibStatus = makeText(String.format(Locale.US,
                          "آفست افقی قطب‌نما (X, Y): [%.1f, %.1f] µT",
                          magHardIron[0], magHardIron[1]), 12, Color.parseColor("#AAAAAA"), false);
                  cardControls.addView(tvCalibStatus, makeParams(0, 6));

                  LinearLayout rowCalib = new LinearLayout(this);
                  rowCalib.setOrientation(LinearLayout.HORIZONTAL);
                  Button btnCalib = makeButton("کالیبراسیون قطب‌نما (چرخش افقی)", "#EF476F");
                  btnCalib.setOnClickListener(v -> toggleMagCalibration(btnCalib));
                  Button btnResetCalib = makeButton("صفر کردن", "#555B6E");
                  btnResetCalib.setOnClickListener(v -> {
                      magHardIron[0] = magHardIron[1] = 0f;
                      savePreferences();
                      updateCalibLabel();
                  });
                  rowCalib.addView(btnCalib, lpInput);
                  rowCalib.addView(btnResetCalib, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 0.6f));
                  cardControls.addView(rowCalib);
                  root.addView(cardControls, makeParams(0, 10));

                  // کارت لاگ پیچ‌ها
                  LinearLayout cardLog = makeCard();
                  cardLog.addView(makeText("لاگ پیچ‌ها و تقاطع‌های ثبت‌شده", 15, Color.WHITE, true));

                  LinearLayout rowLogBtns = new LinearLayout(this);
                  rowLogBtns.setOrientation(LinearLayout.HORIZONTAL);
                  Button btnCopyCsv = makeButton("کپی CSV در کلیپ‌بورد", "#118AB2");
                  btnCopyCsv.setOnClickListener(v -> {
                      ClipboardManager cb = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                      cb.setPrimaryClip(ClipData.newPlainText("TurnLogCSV", csvBuilder.toString()));
                      Toast.makeText(this, "جدول CSV در کلیپ‌بورد کپی شد", Toast.LENGTH_SHORT).show();
                  });
                  Button btnClearLog = makeButton("پاک کردن لاگ", "#555B6E");
                  btnClearLog.setOnClickListener(v -> {
                      turnCounter = 0;
                      csvBuilder.setLength(0);
                      csvBuilder.append("Turn,Duration_s,dPsi_Gyro,dPsi_Mag,Gyro_Weight,dPsi_Fused,Total_Heading,dMagNorm_uT\n");
                      tvLog.setText("هنوز پیچی ثبت نشده است.");
                  });
                  rowLogBtns.addView(btnCopyCsv, lpInput);
                  rowLogBtns.addView(btnClearLog, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 0.7f));
                  cardLog.addView(rowLogBtns, makeParams(6, 8));

                  tvLog = makeText("هنوز پیچی ثبت نشده است.", 12, Color.parseColor("#E0E0E0"), false);
                  tvLog.setTypeface(Typeface.MONOSPACE);
                  cardLog.addView(tvLog);
                  root.addView(cardLog, makeParams(0, 20));

                  scrollView.addView(root);
                  setContentView(scrollView);
              }

              private void updateSliderLabels() {
                  if (tvValSensitivity != null) {
                      tvValSensitivity.setText(String.format(Locale.US, "%.2f  (آستانه پیچ: %.1f°/s)", sliderTurnSensitivity, omegaStart));
                  }
                  if (tvValGyroTrust != null) {
                      tvValGyroTrust.setText(String.format(Locale.US, "%.2f  (پایه اعتماد ژایرو: %.0f%%)", sliderGyroTrust, sliderGyroTrust * 100.0));
                  }
                  if (tvValMagDistortion != null) {
                      tvValMagDistortion.setText(String.format(Locale.US, "%.2f", sliderMagDistortion));
                  }
                  if (tvValVibFilter != null) {
                      tvValVibFilter.setText(String.format(Locale.US, "%.2f  (تأیید پیچ: %.2fs)", sliderVibrationFilter, confirmTimeReq));
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (sensorManager != null) {
                      if (gyroSensor != null) sensorManager.registerListener(this, gyroSensor, SensorManager.SENSOR_DELAY_GAME);
                      if (magSensor != null) sensorManager.registerListener(this, magSensor, SensorManager.SENSOR_DELAY_GAME);
                  }
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (sensorManager != null) {
                      sensorManager.unregisterListener(this);
                  }
              }

              @Override
              public void onSensorChanged(SensorEvent event) {
                  int type = event.sensor.getType();

                  if (type == Sensor.TYPE_MAGNETIC_FIELD) {
                      // فرض افقی بودن گوشی (محور Z عمود بر زمین): فقط مولفه‌های X و Y
                      magRaw[0] = event.values[0];
                      magRaw[1] = event.values[1];
                      hasMag = true;

                      if (isCalibratingMag) {
                          for (int i = 0; i < 2; i++) {
                              if (magRaw[i] < magMin[i]) magMin[i] = magRaw[i];
                              if (magRaw[i] > magMax[i]) magMax[i] = magRaw[i];
                          }
                      }
                      updateHorizontalMagXY();
                  } else if (type == Sensor.TYPE_GYROSCOPE) {
                      processGyroscopeZ(event);
                  }
              }

              private void updateHorizontalMagXY() {
                  if (!hasMag) return;
                  double mx = magRaw[0] - magHardIron[0];
                  double my = magRaw[1] - magHardIron[1];

                  final double betaMag = 0.10;
                  if (!magFilterInit) {
                      magXYFiltered[0] = mx;
                      magXYFiltered[1] = my;
                      magFilterInit = true;
                  } else {
                      magXYFiltered[0] = (1.0 - betaMag) * magXYFiltered[0] + betaMag * mx;
                      magXYFiltered[1] = (1.0 - betaMag) * magXYFiltered[1] + betaMag * my;
                  }
              }

              private void processGyroscopeZ(SensorEvent event) {
                  if (lastGyroTimestamp == 0) {
                      lastGyroTimestamp = event.timestamp;
                      return;
                  }
                  double dt = (event.timestamp - lastGyroTimestamp) * 1e-9;
                  lastGyroTimestamp = event.timestamp;
                  if (dt <= 0 || dt > 0.5) return;

                  // فقط محور Z گوشی (عمود بر زمین)؛ علامت منفی تا گردش به راست مثبت باشد
                  double omegaRawDeg = -Math.toDegrees(event.values[2]);

                  // حذف بایاس
                  double omegaCorr = omegaRawDeg - gyroBiasZ;

                  // فیلتر پایین‌گذر دوطبقه (Cascaded LPF) برای حذف کامل لرزش موتور و جاده در سامسونگ A17
                  omegaFiltered  = (1.0 - lpfAlpha) * omegaFiltered  + lpfAlpha * omegaCorr;
                  omegaFiltered2 = (1.0 - lpfAlpha) * omegaFiltered2 + lpfAlpha * omegaFiltered;

                  double absFiltered = Math.abs(omegaFiltered2);

                  if (currentState == State.STRAIGHT) {
                      // ذخیره پیوسته در بافر حلقوی پیش‌نگری (1.2 ثانیه اخیر)
                      pushToRingBuffer(omegaCorr * dt, dt);

                      if (absFiltered <= omegaStart) {
                          aboveStartTimer = 0.0;

                          // یادگیری بایاس فقط زمانی که نرخ دوران کاملاً آرام است
                          if (absFiltered < 0.55 * omegaStart) {
                              gyroBiasZ = (1.0 - biasLearnRate) * gyroBiasZ + biasLearnRate * omegaRawDeg;
                          }

                          // به‌روزرسانی بردار مغناطیسی مرجع قبل از ورود به پیچ
                          magXYStart[0] = magXYFiltered[0];
                          magXYStart[1] = magXYFiltered[1];
                          magNormStart = getMagHorizontalNorm();
                      } else {
                          // نرخ دوران از آستانه رد شده؛ بررسی تداوم زمانی برای اطمینان از پیچ واقعی (نه تکان دست/دست‌انداز)
                          aboveStartTimer += dt;
                          double[] preData = sumRingBuffer(1.2);

                          if (aboveStartTimer >= confirmTimeReq && Math.abs(preData[0]) >= 2.5) {
                              // --- پیچ واقعی تأیید شد! ---
                              currentState = State.TURNING;
                              turnGyroDeltaPsi = preData[0];
                              turnDuration = preData[1];
                              belowStopTimer = 0.0;
                              settleTailDpsi = 0.0;
                              aboveStartTimer = 0.0;

                              tvStateBanner.setText("وضعیت: در حال چرخش در پیچ (انتگرال‌گیری فعال)");
                              tvStateBanner.setBackgroundColor(Color.parseColor("#D97706"));
                          }
                      }
                  } else if (currentState == State.TURNING) {
                      turnGyroDeltaPsi += omegaCorr * dt;
                      turnDuration += dt;

                      // شرط خروج از پیچ بر اساس سیگنال فیلترشده (تا لرزش جاده مانع خروج از حالت پیچ نشود)
                      if (absFiltered < omegaStop) {
                          belowStopTimer += dt;
                          settleTailDpsi += omegaCorr * dt;
                          if (belowStopTimer >= 0.45) {
                              finalizeTurnAndFuse();
                              currentState = State.STRAIGHT;
                              clearRingBuffer();

                              tvStateBanner.setText("وضعیت: مسیر مستقیم (در حال یادگیری بایاس)");
                              tvStateBanner.setBackgroundColor(Color.parseColor("#1E6F5C"));
                          }
                      } else {
                          belowStopTimer = 0.0;
                          settleTailDpsi = 0.0;
                      }
                  }

                  double liveHeading = normalize360(cumulativeHeading + (currentState == State.TURNING ? turnGyroDeltaPsi : 0.0));
                  tvHeading.setText(String.format(Locale.US, "زاویه سمت خودرو (ψ): %.1f°", liveHeading));
                  tvLiveGyro.setText(String.format(Locale.US,
                          "چرخش فیلترشده: %+.1f°/s | بایاس: %+.2f°/s | Δψ پیچ فعلی: %+.1f°",
                          omegaFiltered2, gyroBiasZ, (currentState == State.TURNING ? turnGyroDeltaPsi : 0.0)));
              }

              private void finalizeTurnAndFuse() {
                  double effectiveDuration = Math.max(0.5, turnDuration - belowStopTimer);
                  double dPsiGyro = turnGyroDeltaPsi - settleTailDpsi;

                  // نادیده گرفتن تغییر لاین‌های جزئی یا نوسانات کمتر از حداقل زاویه پیچ
                  if (Math.abs(dPsiGyro) < minTurnAngle) {
                      turnGyroDeltaPsi = 0.0;
                      return;
                  }

                  // محاسبه تغییرات زاویه قطب‌نما در صفحه افقی (X, Y)
                  double dPsiMag = compute2dMagAngle(magXYStart, magXYFiltered);
                  double innovation = wrapAngle180(dPsiMag - dPsiGyro);
                  double dPsiMagUnwrapped = dPsiGyro + innovation;

                  // محاسبه وزن تلفیق کالمن بر اساس اسلایدر اعتماد به ژایرو و اسلایدر اعوجاج قطب‌نما
                  double magNormEnd = getMagHorizontalNorm();
                  double deltaNorm = Math.abs(magNormEnd - magNormStart);

                  double gyroWeight;
                  if (sliderGyroTrust >= 0.99) {
                      gyroWeight = 1.0; // اعتماد ۱۰۰٪ به ژایرو
                  } else if (sliderGyroTrust <= 0.01) {
                      gyroWeight = 0.0; // اعتماد ۱۰۰٪ به قطب‌نما
                  } else {
                      // گیت رد خطای شدید قطب‌نما بر اساس اسلایدر ۳
                      double nuMax = 45.0 - 33.0 * sliderMagDistortion; // از 45 درجه تا 12 درجه
                      double gamma = 5.0 + 95.0 * sliderMagDistortion;  // ضریب جریمه تغییر اندازه میدان

                      if (Math.abs(innovation) > nuMax) {
                          gyroWeight = 1.0; // رد کامل قطب‌نما به دلیل اغتشاش شدید چهارراه
                      } else {
                          // مدل واریانس زمان‌محور ژایرو در برابر قطب‌نما
                          double baseGyroFactor = (1.0 - sliderGyroTrust) / Math.max(0.05, sliderGyroTrust);
                          double timeFactor = 1.0 + 0.08 * effectiveDuration; // افزایش خطای ژایرو در پیچ‌های خیلی طولانی
                          double pGyro = baseGyroFactor * timeFactor;

                          double normPenalty = 1.0 + (gamma * deltaNorm * deltaNorm) / 100.0;
                          double rMag = normPenalty;

                          double kalmanGainMag = pGyro / (pGyro + rMag);
                          gyroWeight = 1.0 - kalmanGainMag;
                      }
                  }

                  double dPsiFused = gyroWeight * dPsiGyro + (1.0 - gyroWeight) * dPsiMagUnwrapped;
                  cumulativeHeading = normalize360(cumulativeHeading + dPsiFused);
                  turnGyroDeltaPsi = 0.0;

                  turnCounter++;

                  tvLastTurnSummary.setText(String.format(Locale.US,
                          "آخرین پیچ ثبت‌شده (پیچ #%d - مدت: %.1fs):\n" +
                          "• Δψ ژایرو: %+.1f°  |  Δψ قطب‌نما: %+.1f°\n" +
                          "• وزن ژایرو: %.0f%%  |  Δψ نهایی: %+.1f° (Δ|B|: %.1fµT)",
                          turnCounter, effectiveDuration, dPsiGyro, dPsiMagUnwrapped,
                          gyroWeight * 100.0, dPsiFused, deltaNorm));

                  String logLine = String.format(Locale.US,
                          "#%d | T:%.1fs | Gyro:%+.1f° | Mag:%+.1f° | W_g:%.0f%% => Fused:%+.1f° (ψ=%.1f°)",
                          turnCounter, effectiveDuration, dPsiGyro, dPsiMagUnwrapped,
                          gyroWeight * 100.0, dPsiFused, cumulativeHeading);

                  String prevLog = tvLog.getText().toString();
                  if (turnCounter == 1) {
                      tvLog.setText(logLine);
                  } else {
                      tvLog.setText(logLine + "\n" + prevLog);
                  }

                  csvBuilder.append(String.format(Locale.US, "%d,%.2f,%.2f,%.2f,%.3f,%.2f,%.2f,%.2f\n",
                          turnCounter, effectiveDuration, dPsiGyro, dPsiMagUnwrapped,
                          gyroWeight, dPsiFused, cumulativeHeading, deltaNorm));
              }

              /**
               * محاسبه زاویه چرخش افقی ۲ بعدی بین بردار مغناطیسی ابتدای پیچ و انتهای پیچ
               * در دستگاه مختصات اندروید (X به راست، Y به جلو، Z رو به بالا):
               * وقتی خودرو به راست (ساعتگرد) می‌چرخد، بردار میدان مغناطیسی در دستگاه گوشی پادساعتگرد می‌چرخد.
               */
              private double compute2dMagAngle(double[] mStart, double[] mEnd) {
                  double crossZ = mStart[0] * mEnd[1] - mStart[1] * mEnd[0];
                  double dot    = mStart[0] * mEnd[0] + mStart[1] * mEnd[1];
                  return Math.toDegrees(Math.atan2(crossZ, dot));
              }

              private double getMagHorizontalNorm() {
                  double mx = magRaw[0] - magHardIron[0];
                  double my = magRaw[1] - magHardIron[1];
                  return Math.sqrt(mx * mx + my * my);
              }

              private void pushToRingBuffer(double dpsi, double dt) {
                  ringDpsi[ringHead] = dpsi;
                  ringDt[ringHead] = dt;
                  ringHead = (ringHead + 1) % RING_CAPACITY;
                  if (ringCount < RING_CAPACITY) ringCount++;
              }

              private double[] sumRingBuffer(double maxTimeSec) {
                  double sumPsi = 0.0;
                  double sumT = 0.0;
                  for (int i = 0; i < ringCount; i++) {
                      int idx = (ringHead - 1 - i + RING_CAPACITY) % RING_CAPACITY;
                      sumPsi += ringDpsi[idx];
                      sumT += ringDt[idx];
                      if (sumT >= maxTimeSec) break;
                  }
                  return new double[]{sumPsi, sumT};
              }

              private void clearRingBuffer() {
                  ringHead = 0;
                  ringCount = 0;
              }

              private void toggleMagCalibration(Button btn) {
                  if (!isCalibratingMag) {
                      isCalibratingMag = true;
                      magMin[0] = magMin[1] = 1000f;
                      magMax[0] = magMax[1] = -1000f;
                      btn.setText("پایان کالیبراسیون (یک دور افقی بزنید)");
                      btn.setBackgroundColor(Color.parseColor("#FFD166"));
                      btn.setTextColor(Color.BLACK);
                  } else {
                      isCalibratingMag = false;
                      for (int i = 0; i < 2; i++) {
                          if (magMax[i] > magMin[i]) {
                              magHardIron[i] = (magMax[i] + magMin[i]) / 2.0f;
                          }
                      }
                      savePreferences();
                      updateCalibLabel();
                      btn.setText("کالیبراسیون قطب‌نما (چرخش افقی)");
                      btn.setBackgroundColor(Color.parseColor("#EF476F"));
                      btn.setTextColor(Color.WHITE);
                      Toast.makeText(this, "آفست افقی قطب‌نما ذخیره شد", Toast.LENGTH_SHORT).show();
                  }
              }

              private void updateCalibLabel() {
                  tvCalibStatus.setText(String.format(Locale.US,
                          "آفست افقی قطب‌نما (X, Y): [%.1f, %.1f] µT",
                          magHardIron[0], magHardIron[1]));
              }

              private void loadPreferences() {
                  sliderTurnSensitivity = prefs.getFloat("sTurnSens", 0.50f);
                  sliderGyroTrust       = prefs.getFloat("sGyroTrust", 0.75f);
                  sliderMagDistortion   = prefs.getFloat("sMagDist", 0.60f);
                  sliderVibrationFilter = prefs.getFloat("sVibFilter", 0.55f);
                  magHardIron[0]        = prefs.getFloat("magHx", 0f);
                  magHardIron[1]        = prefs.getFloat("magHy", 0f);
              }

              private void savePreferences() {
                  prefs.edit()
                          .putFloat("sTurnSens", (float) sliderTurnSensitivity)
                          .putFloat("sGyroTrust", (float) sliderGyroTrust)
                          .putFloat("sMagDist", (float) sliderMagDistortion)
                          .putFloat("sVibFilter", (float) sliderVibrationFilter)
                          .putFloat("magHx", magHardIron[0])
                          .putFloat("magHy", magHardIron[1])
                          .apply();
              }

              private static double wrapAngle180(double deg) {
                  while (deg > 180.0) deg -= 360.0;
                  while (deg < -180.0) deg += 360.0;
                  return deg;
              }

              private static double normalize360(double deg) {
                  deg = deg % 360.0;
                  if (deg < 0) deg += 360.0;
                  return deg;
              }

              // --- رابط کاربری و اسلایدرهای ۰ تا ۱ ---
              private interface SliderCallback {
                  void onValueChanged(double val0to1);
              }

              private SeekBar addSliderControl(LinearLayout parent, String title, String subtitle,
                                               double initVal, TextView tvValueOut, SliderCallback callback) {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setBackgroundColor(Color.parseColor("#262E40"));
                  int p = dp(10);
                  box.setPadding(p, p, p, p);

                  LinearLayout header = new LinearLayout(this);
                  header.setOrientation(LinearLayout.HORIZONTAL);
                  TextView tvTitle = makeText(title, 13, Color.WHITE, true);
                  tvValueOut.setTextSize(13);
                  tvValueOut.setTextColor(Color.parseColor("#06D6A0"));
                  tvValueOut.setTypeface(Typeface.DEFAULT_BOLD);
                  tvValueOut.setGravity(Gravity.END);

                  header.addView(tvTitle, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1.4f));
                  header.addView(tvValueOut, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1.0f));
                  box.addView(header);

                  TextView tvSub = makeText(subtitle, 11, Color.parseColor("#A5B1C2"), false);
                  box.addView(tvSub, makeParams(2, 6));

                  SeekBar sb = new SeekBar(this);
                  sb.setMax(100);
                  sb.setProgress((int) Math.round(initVal * 100.0));
                  sb.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override
                      public void onProgressChanged(SeekBar seekBar, int progress, boolean fromUser) {
                          if (fromUser) {
                              callback.onValueChanged(progress / 100.0);
                          }
                      }
                      @Override public void onStartTrackingTouch(SeekBar seekBar) {}
                      @Override public void onStopTrackingTouch(SeekBar seekBar) {}
                  });
                  box.addView(sb);

                  parent.addView(box, makeParams(8, 0));
                  return sb;
              }

              private LinearLayout makeCard() {
                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setBackgroundColor(Color.parseColor("#1E2433"));
                  int p = dp(12);
                  card.setPadding(p, p, p, p);
                  return card;
              }

              private TextView makeText(String text, int sp, int color, boolean bold) {
                  TextView tv = new TextView(this);
                  tv.setText(text);
                  tv.setTextSize(sp);
                  tv.setTextColor(color);
                  if (bold) tv.setTypeface(Typeface.DEFAULT_BOLD);
                  return tv;
              }

              private EditText makeInput(String initial) {
                  EditText et = new EditText(this);
                  et.setText(initial);
                  et.setTextColor(Color.WHITE);
                  et.setTextSize(14);
                  et.setBackgroundColor(Color.parseColor("#2B3346"));
                  et.setPadding(dp(8), dp(6), dp(8), dp(6));
                  et.setInputType(InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_FLAG_DECIMAL | InputType.TYPE_NUMBER_FLAG_SIGNED);
                  return et;
              }

              private Button makeButton(String title, String hexColor) {
                  Button btn = new Button(this);
                  btn.setText(title);
                  btn.setTextSize(13);
                  btn.setTextColor(Color.WHITE);
                  btn.setBackgroundColor(Color.parseColor(hexColor));
                  return btn;
              }

              private LinearLayout.LayoutParams makeParams(int topDp, int bottomDp) {
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  lp.setMargins(0, dp(topDp), 0, dp(bottomDp));
                  return lp;
              }

              private int dp(int v) {
                  return Math.round(v * getResources().getDisplayMetrics().density);
              }

              @Override
              public void onAccuracyChanged(Sensor sensor, int accuracy) {}
          }

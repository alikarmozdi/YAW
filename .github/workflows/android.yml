      - name: Accept Android SDK Licenses and Build APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          gradle assembleDebug --no-daemon

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: TurnYawEstimator-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Save Generated Project Files to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add settings.gradle build.gradle app/
          git commit -m "Update to v2.0 Samsung A17 flat-Z with 0-1 sliders [skip ci]" || true
          git push || true
